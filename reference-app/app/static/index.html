<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reference LLM App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #18181b; }
    h2 { margin-bottom: 4px; }
    p.sub { color: #71717a; margin-top: 0; }
    textarea { width: 100%; height: 90px; padding: 8px; box-sizing: border-box; font-size: 14px; }
    select, button { padding: 8px 12px; font-size: 14px; }
    button { background: #18181b; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    #answer { white-space: pre-wrap; background: #f4f4f5; padding: 16px; border-radius: 8px; margin-top: 16px; min-height: 24px; }
    #status { color: #71717a; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Reference LLM App 🧪</h2>
  <p class="sub">A simple chat box that generates traffic for the observability platform.</p>

  <div class="row">
    <label for="user">User:</label>
    <select id="user">
      <option>user_1</option>
      <option>user_2</option>
      <option>user_3</option>
    </select>
  </div>

  <textarea id="prompt" placeholder="Ask something..."></textarea>

  <div class="row">
    <button id="send">Send</button>
    <span id="status"></span>
  </div>

  <div id="answer"></div>

  <script>
    const btn = document.getElementById("send");
    const answerBox = document.getElementById("answer");
    const statusEl = document.getElementById("status");

    btn.onclick = async () => {
      const prompt = document.getElementById("prompt").value.trim();
      const user_id = document.getElementById("user").value;
      if (!prompt) return;

      statusEl.textContent = "Thinking...";
      answerBox.textContent = "";
      btn.disabled = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, user_id }),
        });
        const data = await res.json();
        answerBox.textContent = data.answer ?? JSON.stringify(data);
      } catch (e) {
        answerBox.textContent = "Error: " + e.message;
      } finally {
        statusEl.textContent = "";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
